server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # Vite fingerprints these filenames with a content hash, so they're safe
    # to cache forever; a new deploy ships new filenames instead of mutating
    # these.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # TanStack Router handles routing client-side, so any path that isn't
    # a real file (e.g. /library/42) must still be served index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
